<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>SelfBot Panel</title>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body {
    background: #0a0a0a;
    color: #00ff41;
    font-family: 'Courier New', monospace;
    padding: 10px;
    font-size: 14px;
}
h1 {
    text-align: center;
    color: #ff0040;
    font-size: 1.3rem;
    margin: 10px 0 15px;
    text-shadow: 0 0 10px #ff0040;
}
.slot {
    background: #111;
    border: 1px solid #333;
    border-radius: 8px;
    padding: 12px;
    margin-bottom: 12px;
    position: relative;
}
.slot-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 8px;
}
.slot-num {
    color: #ff0040;
    font-weight: bold;
    font-size: 1.1rem;
}
.status {
    font-size: 0.75rem;
    padding: 3px 8px;
    border-radius: 4px;
    background: #222;
    color: #666;
}
.status.online { background: #003300; color: #00ff41; }
.status.spamming { background: #330000; color: #ff0040; animation: pulse 1s infinite; }
@keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.5; } }

input, textarea {
    width: 100%;
    background: #1a1a1a;
    color: #0f0;
    border: 1px solid #444;
    padding: 10px;
    margin: 6px 0;
    border-radius: 4px;
    font-family: inherit;
    font-size: 0.9rem;
}
input:focus, textarea:focus {
    outline: none;
    border-color: #00ff41;
}

.user-info {
    color: #00ff41;
    font-size: 0.85rem;
    margin: 5px 0;
    min-height: 20px;
}
.user-info.error { color: #ff0040; }

.btn-row {
    display: flex;
    gap: 6px;
    margin-top: 8px;
    flex-wrap: wrap;
}
button {
    flex: 1;
    min-width: 70px;
    padding: 10px 5px;
    border: none;
    border-radius: 4px;
    font-weight: bold;
    font-size: 0.8rem;
    cursor: pointer;
    transition: all 0.2s;
}
button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
}
.btn-login { background: #0066cc; color: white; }
.btn-login:hover:not(:disabled) { background: #0088ff; }
.btn-start { background: #00aa00; color: white; }
.btn-start:hover:not(:disabled) { background: #00dd00; }
.btn-stop { background: #aa0000; color: white; }
.btn-stop:hover:not(:disabled) { background: #dd0000; }
.btn-leave { background: #ff6600; color: white; }
.btn-leave:hover:not(:disabled) { background: #ff8800; }

.token-input { font-size: 0.75rem; }
</style>
</head>
<body>
<h1>🔥 MASS PING & EVACUATION 🔥</h1>
<div id="slots"></div>

<script>
const API = '';

// Generate 10 slots
for (let i = 0; i < 10; i++) {
    document.getElementById('slots').innerHTML += `
    <div class="slot" id="slot-${i}">
        <div class="slot-header">
            <span class="slot-num">#${i + 1}</span>
            <span class="status" id="status-${i}">OFFLINE</span>
        </div>
        <input type="password" class="token-input" id="t${i}" placeholder="Discord Token" autocomplete="off">
        <div class="user-info" id="user-${i}"></div>
        <button class="btn-login" id="btn-login-${i}" onclick="login(${i})">VALIDATE & LOGIN</button>
        
        <input type="text" id="c${i}" placeholder="Channel IDs (comma separated)" disabled>
        <textarea id="m${i}" placeholder="Custom ping message" rows="2" disabled></textarea>
        <input type="text" id="l${i}" placeholder="Server ID to leave" disabled>
        
        <div class="btn-row">
            <button class="btn-start" id="btn-start-${i}" onclick="startSpam(${i})" disabled>START</button>
            <button class="btn-stop" id="btn-stop-${i}" onclick="stopSpam(${i})" disabled>STOP</button>
            <button class="btn-leave" id="btn-leave-${i}" onclick="leaveServer(${i})" disabled>LEAVE</button>
        </div>
    </div>`;
}

async function login(i) {
    const btn = document.getElementById(`btn-login-${i}`);
    const token = document.getElementById(`t${i}`).value.trim();
    const userDiv = document.getElementById(`user-${i}`);
    const status = document.getElementById(`status-${i}`);
    
    if (!token) return;
    
    btn.disabled = true;
    userDiv.innerText = 'Validating...';
    userDiv.className = 'user-info';
    
    try {
        const res = await fetch('/login', {
            method: 'POST',
            headers: {'Content-Type': 'application/json'},
            body: JSON.stringify({ token, slot: i })
        });
        const data = await res.json();
        
        if (data.status === 'valid') {
            userDiv.innerText = `Logged in as @${data.user}`;
            userDiv.className = 'user-info';
            status.innerText = 'ONLINE';
            status.className = 'status online';
            
            // Enable controls
            document.getElementById(`c${i}`).disabled = false;
            document.getElementById(`m${i}`).disabled = false;
            document.getElementById(`l${i}`).disabled = false;
            document.getElementById(`btn-start-${i}`).disabled = false;
            document.getElementById(`btn-stop-${i}`).disabled = false;
            document.getElementById(`btn-leave-${i}`).disabled = false;
            btn.style.display = 'none'; // Hide login button after success
        } else {
            userDiv.innerText = 'Invalid token';
            userDiv.className = 'user-info error';
            status.innerText = 'FAILED';
            btn.disabled = false;
        }
    } catch (e) {
        userDiv.innerText = 'Connection error';
        userDiv.className = 'user-info error';
        btn.disabled = false;
    }
}

async function startSpam(i) {
    const channels = document.getElementById(`c${i}`).value
        .split(',')
        .map(x => x.trim())
        .filter(x => x);
    
    if (channels.length === 0) {
        alert('Enter at least one channel ID');
        return;
    }
    
    const message = document.getElementById(`m${i}`).value;
    
    await fetch('/configure', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ slot: i, channels, message })
    });
    
    await fetch('/spam/start', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ slot: i })
    });
    
    document.getElementById(`status-${i}`).innerText = 'SPAMMING';
    document.getElementById(`status-${i}`).className = 'status spamming';
    document.getElementById(`btn-start-${i}`).disabled = true;
}

async function stopSpam(i) {
    await fetch('/spam/stop', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ slot: i })
    });
    
    document.getElementById(`status-${i}`).innerText = 'ONLINE';
    document.getElementById(`status-${i}`).className = 'status online';
    document.getElementById(`btn-start-${i}`).disabled = false;
}

async function leaveServer(i) {
    const guildId = document.getElementById(`l${i}`).value.trim();
    if (!guildId) return;
    
    const res = await fetch('/leave', {
        method: 'POST',
        headers: {'Content-Type': 'application/json'},
        body: JSON.stringify({ slot: i, guildId })
    });
    const data = await res.json();
    
    const userDiv = document.getElementById(`user-${i}`);
    userDiv.innerText = data.status || data.error;
    userDiv.className = data.error ? 'user-info error' : 'user-info';
}
</script>
</body>
</html>
